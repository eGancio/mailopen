[package]
name = "mailopen"
description = "mailopen: a small, open-source mail client with a unified inbox for many accounts."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
name = "mailopen"
path = "src/lib.rs"

[[bin]]
name = "mailopen"
path = "src/main.rs"

[dependencies]
mailopen-core.workspace = true
eframe.workspace = true
egui.workspace = true
log.workspace = true
env_logger.workspace = true
chrono.workspace = true
rfd.workspace = true
open.workspace = true
hayro.workspace = true
image.workspace = true
directories.workspace = true

[build-dependencies]
# Windows: icon and version info inside mailopen.exe (build.rs)
embed-resource = "=3.0.11"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu"] }

[lints]
workspace = true
