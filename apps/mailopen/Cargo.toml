[package]
name = "mailopen"
description = "mailopen: a small, open-source mail client with a unified inbox for many accounts."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
name = "mailopen"
path = "src/lib.rs"

[[bin]]
name = "mailopen"
